<!--
Manual dev harness for the viewer bundle (viewer/generated/viewer.js, built
from viewer-host.tsx). Open directly in a browser against mock SVG/component
data below to exercise pan/zoom/net-highlight/panel UI without running the
full pipeline on a real .cst file.
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CircuitScript Viewer Preview</title>
</head>
<body>
  <div id="root"></div>
  <template id="cs-svg-source">
    <svg width="400" height="200" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
        <g class="cs-component" id="comp-0-R1">
          <rect x="10" y="10" width="20" height="10" fill="none" stroke="#333" stroke-width="0.5"></rect>
          <text x="12" y="8" font-size="4">R1</text>
        </g>
        <g class="cs-component" id="comp-0-C1">
          <rect x="45" y="10" width="10" height="10" fill="none" stroke="#333" stroke-width="0.5"></rect>
          <text x="45" y="8" font-size="4">C1</text>
        </g>
        <g class="cs-component" id="comp-0-U1">
          <path d="M70 5 L90 5 L90 30 L70 30 Z" fill="none" stroke="#333" stroke-width="0.5"></path>
          <text x="72" y="4" font-size="4">U1</text>
        </g>
      </svg>
  </template>
  <script>
    window.__CS_COMPONENTS__ = [
      {
        domId: 'comp-0-R1',
        type: 'resistor',
        kind: 'component',
        refDes: 'R1',
        instanceName: 'R1',
        sourceLine: null,
        sourceFile: null,
        params: [
          { key: 'value', value: '10k' },
          { key: 'tolerance', value: '5%' }
        ],
        pins: [
          { id: '1', name: '1', type: 'passive', side: 'left', position: 0, netName: 'NET~1' },
          { id: '2', name: '2', type: 'passive', side: 'right', position: 0, netName: 'NET~2' }
        ]
      },
      {
        domId: 'comp-0-C1',
        type: 'capacitor',
        kind: 'component',
        refDes: 'C1',
        instanceName: 'C1',
        sourceLine: null,
        sourceFile: null,
        params: [
          { key: 'value', value: '100nF' }
        ],
        pins: [
          { id: '1', name: '1', type: 'passive', side: 'left', position: 0, netName: 'NET~2' },
          { id: '2', name: '2', type: 'passive', side: 'right', position: 0, netName: 'GND' }
        ]
      },
      {
        domId: 'comp-0-U1',
        type: 'ic',
        kind: 'component',
        refDes: 'U1',
        instanceName: 'U1',
        sourceLine: null,
        sourceFile: null,
        params: [
          { key: 'part', value: 'LM358' }
        ],
        pins: [
          { id: '1', name: 'VCC', type: 'power_input', side: 'top', position: 0, netName: 'VCC' },
          { id: '2', name: 'GND', type: 'power_input', side: 'bottom', position: 0, netName: 'GND' },
          { id: '3', name: 'OUT', type: 'output', side: 'right', position: 0, netName: 'NET~1' }
        ]
      }
    ];
  </script>
  <script src="generated/viewer.js"></script>
</body>
</html>
